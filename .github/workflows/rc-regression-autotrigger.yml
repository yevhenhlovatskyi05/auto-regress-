name: RC Regression Autotrigger

# Весь флоу живе тут, у Git:
# - schedule сам тригерить перевірку Slack (орієнтовно раз на день, ~9:00 Kyiv)
# - вікно перевірки - з моменту попередньої перевірки (без розривів), а не фіксовані 24г
# - якщо знайдено релізне повідомлення - запускаються тести, якщо ні - тести не йдуть
# - результат видно в Actions -> цей workflow -> кожен run має точний час і статус (✅/❌)
#   плюс у Summary кожного run буде час перевірки, знайдено чи ні, і текст повідомлення
# - результат кожного run також дописується рядком в STATUS.md (в main)

on:
  schedule:
    # Ціль - приблизно 9:00 за Києвом, але GitHub НЕ гарантує точний час schedule-запуску:
    # на low-activity репозиторії з безкоштовним тарифом затримка помітно росте з часом
    # (спостерігали від ~1г наприкінці серпня до 13-14г на початку вересня). Тому gate-крок
    # нижче НЕ обмежує вікно годинами - приймає перший schedule-запуск за календарний день
    # (Kyiv), яким би пізнім він не був, і відкидає лише повторні спрацювання того ж дня
    # (два cron-рядки нижче - лише стартовий сигнал на обидва сезонні зсуви).
    - cron: '0 6 * * 1-5'   # орієнтовно 9:00 Kyiv влітку (UTC+3)
    - cron: '0 7 * * 1-5'   # орієнтовно 9:00 Kyiv взимку (UTC+2)
  workflow_dispatch: {}   # можливість запустити вручну для перевірки

permissions:
  contents: write

jobs:
  check-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Skip if already checked today via schedule
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KYIV_DATE=$(TZ='Europe/Kyiv' date +%Y-%m-%d)

          # Жодного обмеження за годиною - затримка GitHub непередбачувана й росте з часом,
          # тому приймаємо перший schedule-запуск за сьогодні, яким би пізнім він не був.
          # Захист від подвійного спрацювання (два cron-рядки на літній/зимовий час
          # можуть обидва спрацювати того ж дня) - перевіряємо службовий файл з epoch
          # часу попередньої перевірки (той самий файл далі задає ліву межу Slack-запиту).
          LAST_CHECK_EPOCH=$(cat .github/last-scheduled-check.txt 2>/dev/null || true)
          LAST_CHECK=""
          if [ -n "$LAST_CHECK_EPOCH" ]; then
            LAST_CHECK=$(TZ='Europe/Kyiv' date -d "@${LAST_CHECK_EPOCH}" '+%Y-%m-%d')
          fi
          if [ "$LAST_CHECK" = "$KYIV_DATE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=сьогоднішня (${KYIV_DATE}) schedule-перевірка вже виконана раніше" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Note skipped run
        if: steps.gate.outputs.skip == 'true'
        run: |
          echo "### RC Regression Autotrigger" >> "$GITHUB_STEP_SUMMARY"
          echo "Запуск пропущено: ${{ steps.gate.outputs.reason }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Check Slack release channel
        id: check
        if: steps.gate.outputs.skip != 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          CHANNEL_ID="C026KBTS35F"
          # Вікно перевірки - з моменту попередньої реальної перевірки (службовий файл),
          # а не фіксовані 24г. Це закриває розрив, який могла утворити нерівномірна
          # затримка GitHub-розкладу (наприклад, вчора перевірка була рано, сьогодні -
          # пізно, і між ними пройшло більше доби). Для найпершого запуску, коли файлу
          # ще немає, відкочуємось на стандартні останні 24г.
          LAST_CHECK_EPOCH=$(cat .github/last-scheduled-check.txt 2>/dev/null || true)
          if [ -n "$LAST_CHECK_EPOCH" ]; then
            OLDEST="$LAST_CHECK_EPOCH"
          else
            OLDEST=$(( $(date +%s) - 86400 ))
          fi

          RESPONSE=$(curl -s -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            "https://slack.com/api/conversations.history?channel=${CHANNEL_ID}&oldest=${OLDEST}")

          OK=$(echo "$RESPONSE" | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            ERROR_MSG=$(echo "$RESPONSE" | jq -r '.error // "unknown"')
            echo "Slack API error: $ERROR_MSG"
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "matched_text=" >> "$GITHUB_OUTPUT"
            echo "error=$ERROR_MSG" >> "$GITHUB_OUTPUT"
            echo "message_count=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Скільки повідомлень реально повернув Slack за цей проміжок - якщо колись
          # тут буде 0 при тому, що повідомлення точно було, або підозріло мало при
          # активному каналі - це підказка на пагінацію/обмеження API, а не на баг keyword-пошуку.
          MSG_COUNT=$(echo "$RESPONSE" | jq '.messages | length')
          echo "Отримано повідомлень від Slack: $MSG_COUNT"

          KEYWORDS=("start regress to RC")
          FOUND="false"
          MATCHED_TEXT=""

          while IFS= read -r TEXT; do
            LOWER_TEXT=$(echo "$TEXT" | tr '[:upper:]' '[:lower:]')
            for KW in "${KEYWORDS[@]}"; do
              LOWER_KW=$(echo "$KW" | tr '[:upper:]' '[:lower:]')
              if [[ "$LOWER_TEXT" == *"$LOWER_KW"* ]]; then
                FOUND="true"
                MATCHED_TEXT="$TEXT"
                break 2
              fi
            done
          done < <(echo "$RESPONSE" | jq -r '.messages[].text // ""')

          echo "found=$FOUND" >> "$GITHUB_OUTPUT"
          echo "matched_text=$MATCHED_TEXT" >> "$GITHUB_OUTPUT"
          echo "error=" >> "$GITHUB_OUTPUT"
          echo "message_count=$MSG_COUNT" >> "$GITHUB_OUTPUT"

      - name: Run regression autotests
        id: autotests
        # Запускаються, якщо в Slack знайдено релізне повідомлення (авто-розклад),
        # АБО якщо workflow запущено вручну кнопкою "Run autotest" (workflow_dispatch) -
        # тоді тести йдуть незалежно від Slack.
        if: steps.gate.outputs.skip != 'true' && (steps.check.outputs.found == 'true' || github.event_name == 'workflow_dispatch')
        env:
          RC_BASIC_AUTH_USER: ${{ secrets.RC_BASIC_AUTH_USER }}
          RC_BASIC_AUTH_PASS: ${{ secrets.RC_BASIC_AUTH_PASS }}
        run: |
          set +e
          pip install -r requirements.txt
          playwright install --with-deps chromium
          pytest tests/test_track_order.py -v > pytest_output.txt 2>&1
          EXIT_CODE=$?
          set -e

          cat pytest_output.txt

          SUMMARY=$(tail -n 1 pytest_output.txt | tr '\n' ' ')
          if [ "$EXIT_CODE" -eq 0 ]; then
            STATUS="✅ passed"
          else
            STATUS="❌ failed"
          fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Write run summary
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          echo "### RC Regression Autotrigger" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Поле | Значення |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Час перевірки (UTC) | $(date -u '+%Y-%m-%d %H:%M:%S') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Релізне повідомлення знайдено | ${{ steps.check.outputs.found }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Текст повідомлення | ${{ steps.check.outputs.matched_text }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Отримано повідомлень від Slack | ${{ steps.check.outputs.message_count }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.check.outputs.error }}" ]; then
            echo "| Slack API помилка | ${{ steps.check.outputs.error }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          AUTOTEST_STATUS="${{ steps.autotests.outputs.status }}"
          if [ -n "$AUTOTEST_STATUS" ]; then
            echo "| Автотести | ${AUTOTEST_STATUS} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Підсумок автотестів | ${{ steps.autotests.outputs.summary }} |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Автотести | не запускались (Slack-повідомлення не знайдено і запуск не ручний) |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update STATUS.md and push
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          NOW_EPOCH=$(date +%s)
          DATE=$(TZ='Europe/Kyiv' date -d "@${NOW_EPOCH}" '+%Y-%m-%d')
          KYIV_TIME=$(TZ='Europe/Kyiv' date -d "@${NOW_EPOCH}" '+%H:%M:%S')
          FOUND="${{ steps.check.outputs.found }}"
          TEXT="${{ steps.check.outputs.matched_text }}"
          # Прибираємо переноси рядків і escape'имо "|", щоб не зламати markdown-таблицю
          TEXT=$(echo "$TEXT" | tr '\n' ' ' | sed 's/|/\\|/g')
          AUTOTEST_STATUS="${{ steps.autotests.outputs.status }}"
          AUTOTEST_SUMMARY="${{ steps.autotests.outputs.summary }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          BUTTON='[![Run autotest](data:image/svg+xml;base64,)](https://github.com/yevhenhlovatskyi05/auto-regress-/actions/workflows/rc-regression-autotrigger.yml)'

          # Кілька спроб: інший (або попередній re-run цього ж) workflow-запуск міг
          # уже запушити свій коміт у main, поки цей job працював - тоді звичайний
          # push відхилиться як non-fast-forward. Щоразу підтягуємо свіжий main і
          # рахуємо номер рядка/розділ автотестів заново з нього.
          PUSHED=false
          for ATTEMPT in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f STATUS.md ]; then
              {
                echo "# RC Regression Autotrigger — Status"
                echo ""
                echo "| № | Дата | Час (Kyiv) | Команду знайдено | Текст повідомлення |"
                echo "|---|---|---|---|---|"
                echo "| 1 | ${DATE} | ${KYIV_TIME} | ${FOUND} | ${TEXT} |"
                echo ""
                echo "$BUTTON"
              } > STATUS.md
            else
              LAST_LINE=$(grep -n '^| [0-9][0-9]* |' STATUS.md | tail -1 | cut -d: -f1 || true)
              LAST_NUM=$(grep -n '^| [0-9][0-9]* |' STATUS.md | tail -1 | sed -E 's/^[0-9]+:\| *([0-9]+) .*/\1/' || true)
              # Якщо в таблиці ще немає жодного рядка з даними (лише заголовок) -
              # вставляємо одразу після розділювача "|---|", а не покладаємось на
              # LAST_LINE (який був би 0 і тихо "загубив" би перший рядок).
              SEP_LINE=$(grep -n '^|---|---|---|---|---|$' STATUS.md | head -1 | cut -d: -f1 || true)
              INSERT_AFTER="${LAST_LINE:-$SEP_LINE}"
              NEXT=$(( ${LAST_NUM:-0} + 1 ))
              NEW_ROW="| ${NEXT} | ${DATE} | ${KYIV_TIME} | ${FOUND} | ${TEXT} |"
              awk -v line="${INSERT_AFTER:-0}" -v newrow="$NEW_ROW" 'NR==line{print; print newrow; next}{print}' STATUS.md > STATUS.md.tmp
              mv STATUS.md.tmp STATUS.md
            fi

            if [ -n "$AUTOTEST_STATUS" ]; then
              if grep -q '^## Останній запуск автотестів$' STATUS.md; then
                sed -i '/^## Останній запуск автотестів$/,$d' STATUS.md
              fi
              {
                echo ""
                echo "## Останній запуск автотестів"
                echo ""
                echo "- Статус: ${AUTOTEST_STATUS}"
                echo "- Час: ${DATE} ${KYIV_TIME} (Kyiv)"
                echo "- Підсумок: ${AUTOTEST_SUMMARY}"
                echo "- [Повний лог запуску](${RUN_URL})"
              } >> STATUS.md
            fi

            # Службовий файл з epoch моменту останньої реальної schedule-перевірки:
            # gate-крок читає його для дедуплікації "раз на день", а Slack-крок наступного
            # запуску - як ліву межу вікна (щоб не було розривів між перевірками).
            # Окремий файл, а не коментар у самому STATUS.md, щоб нічого зайвого
            # не потрапляло у видиму частину документа.
            if [ "${{ github.event_name }}" = "schedule" ]; then
              mkdir -p .github
              echo "$NOW_EPOCH" > .github/last-scheduled-check.txt
            fi

            git add STATUS.md .github/last-scheduled-check.txt 2>/dev/null || git add STATUS.md
            if git diff --cached --quiet; then
              echo "Немає змін у STATUS.md"
              PUSHED=true
              break
            fi

            git commit -m "Update STATUS.md after regression check run"
            if git push origin HEAD:main; then
              PUSHED=true
              break
            fi

            echo "Push відхилено (спроба ${ATTEMPT}), пробуємо ще раз..."
            sleep $(( (RANDOM % 3) + 1 ))
          done

          if [ "$PUSHED" != "true" ]; then
            echo "Не вдалося запушити STATUS.md після кількох спроб" >&2
            exit 1
          fi
